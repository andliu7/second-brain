<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#EDEBF2" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#140B28" media="(prefers-color-scheme: dark)"/><meta name="description" content="Your personal workspace for knowledge, skills, goals, and AI."/><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><title>Second Brain, your personal workspace</title>
<!-- The theme is set here, before the stylesheet paints anything, so a dark reload never flashes light.
     It mirrors resolve() in src/lib/theme.ts: a saved light or dark wins, otherwise the system decides. -->
<script>(function(){var p;try{p=localStorage.getItem('brain-theme')}catch(e){}var d=p==='dark'||(p!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;r.setAttribute('data-theme',d?'dark':'light');if(d)r.classList.add('dark')})()</script>
</head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
