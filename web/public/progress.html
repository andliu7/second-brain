<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Second Brain · Build progress</title><style>body{margin:0;background:#101113;color:#f0eeeb;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:9vh auto;padding:24px}a{color:#e6b391}small{color:#a9a9b0}h1{font-size:42px;letter-spacing:-1.5px;line-height:1.2;font-weight:550}#rows{margin:36px 0;border-top:1px solid #313237}.row{display:flex;gap:20px;padding:22px 0;border-bottom:1px solid #313237}.dot{flex:0 0 10px;height:10px;border-radius:50%;background:#575960;margin-top:10px}.complete{background:#9acba6}.working{background:#e6b391}.row h2{font-size:17px;margin:0;font-weight:550}.row p{margin:6px 0 0;color:#aaaab4}.pill{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#e6b391}footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}</style></head><body><main><span class="pill">SECOND BRAIN / LIVE BUILD</span><h1 id="phase">Building your workspace</h1><small id="bar"></small><section id="rows" aria-live="polite"></section><footer><a href="/">Open the workspace →</a><small id="time"></small></footer><p><small>This page refreshes as work progresses. “Complete” marks verified work; pending items remain visible.</small></p></main><script>async function refresh(){try{const r=await fetch('/progress.json?t='+Date.now());const p=await r.json();document.getElementById('phase').textContent=p.phase;document.getElementById('bar').textContent='The bar: '+p.bar;const rows=document.getElementById('rows');rows.replaceChildren();for(const item of p.checks){const row=document.createElement('article');row.className='row';const dot=document.createElement('span');dot.className='dot '+item.status;const body=document.createElement('div');const title=document.createElement('h2');title.textContent=item.label+' · '+item.status;const text=document.createElement('p');text.textContent=item.detail;body.append(title,text);row.append(dot,body);rows.append(row)}document.getElementById('time').textContent='Updated '+new Date(p.updated).toLocaleTimeString()}catch{document.getElementById('time').textContent='Reconnecting…'}}refresh();setInterval(refresh,4000);</script></body></html>
